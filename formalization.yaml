version: v0.4
project:
  name: Clipped sufficient scales for convex quadratic cuts
  description: A clipped sufficient scale for convex C² quadratic cuts. Global ambient convexity
    and C² regularity are required. The anchor need not lie in B. The scale is not claimed maximal,
    positive or computable.
  authors:
  - David E. Bernal Neira
  responsible_maintainers:
