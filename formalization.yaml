status:
  scope: For globally convex C² real-valued f on the full joint real coordinate space, arbitrary
    anchor a and retained set B, the explicit sufficient scale is min(1,2*infimum of the positive-curvature
    ratio range), or 1 when that domain is empty. It lies in [0,1]; all nonnegative coefficients
    below it give tangent <= cut <= f and cut <= unit-scale Taylor cut on B. Derivatives are actual
    first/nested Frechet derivatives. B may retain domain/integer restrictions; a need not belong
    to B. Empty B and zero curvature are retained. No maximal/necessary/strictly-positive/computable
    scale, strict dominance, algorithmic return, master attainment, solver or performance claim
    is included.
